# SMOODEV-1808: build the betting-bot API image and push to GHCR for the SmooAI
# prod EKS cluster (migrated off standalone ECS). MUST be linux/arm64 — the EKS
# nodes are Graviton (r7g.large); an x86 image would CrashLoop with "exec format
# error". The image carries NO secrets (DB/Kalshi creds come from the k8s Secret
# at runtime), so the package can be public — which lets the cluster pull it
# without a pull secret.
name: Build EKS image 🐳

on:
    push:
        branches: [main]
        paths:
            - 'api.py'
            - 'db.py'
            - 'espn.py'
            - 'kalshi_client.py'
            - 'scanner.py'
            - 'pyproject.toml'
            - 'uv.lock'
            - 'Dockerfile'
            - '.github/workflows/build-image.yml'
    workflow_dispatch:

concurrency:
    group: build-image-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        env:
            IMAGE: ghcr.io/${{ github.repository_owner }}/predictions
        steps:
            - uses: actions/checkout@v4

            - name: Set up QEMU (arm64 emulation)
              uses: docker/setup-qemu-action@v3

            - name: Set up Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build & push (linux/arm64)
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/arm64
                  push: true
                  build-args: |
                      CACHE_BUST=${{ github.sha }}
                  tags: |
                      ${{ env.IMAGE }}:latest
                      ${{ env.IMAGE }}:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
